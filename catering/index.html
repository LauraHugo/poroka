<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Laura & Hugo – Catering</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #F5F2EE;
      overflow: hidden;
    }

    #wrapper {
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #B89A4F;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="loader">Odpiram catering pogled ...</div>
  <div id="wrapper"></div>

  <script>
    const baseUrl =
      'https://script.google.com/a/macros/digiteh.eu/s/AKfycbwjhVYGbEueLoCFNFHbfH5UvGL1MUeCs6gcCFomPiPh58Wg97Kz8h_hjKfBtHhA7KsK/exec';

    // Cache-buster je namenoma drugačen pri vsakem odpiranju.
    const finalUrl =
      baseUrl +
      '?page=catering&cb=' +
      Date.now();

    const ifrm =
      document.createElement('iframe');

    ifrm.src = finalUrl;

    ifrm.onload = function () {
      document.getElementById('loader').style.display = 'none';
    };

    document
      .getElementById('wrapper')
      .appendChild(ifrm);
  </script>

</body>
</html>
